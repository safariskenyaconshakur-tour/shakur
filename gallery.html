<!DOCTYPE html>
<html>
<head>
<title>Safari Photo Gallery | Safari Kenya Con Shakur</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f4f4f4;
}

h1{
text-align:center;
padding:30px;
}

.gallery{
display:grid;
grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
gap:15px;
padding:20px;
}

.gallery img{
width:100%;
height:220px;
object-fit:cover;
border-radius:6px;
cursor:pointer;
transition:0.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

/* POPUP IMAGE */

#popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
}

#popup img{
max-width:90%;
max-height:90%;
border-radius:8px;
}

#popup span{
position:absolute;
top:30px;
right:40px;
font-size:40px;
color:white;
cursor:pointer;
}
header{
background:#0a4d2c;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

nav a:hover{
color:#f4d03f;
}

  .logo-area{
display:flex;
align-items:center;
gap:15px;
}

.logo-area img{
height:85px;        /* controls size */
width:auto;
object-fit:contain;
border-radius:5px;  /* smooth edges */
}

.logo-area h2{
margin:0;
font-size:20px;
}
  .logo-area img{
image-rendering: -webkit-optimize-contrast;
}

</style>

</head>

<body>

<header>
<div class="logo-area">
<img src="images/logo.png" alt="Safari Kenya Logo">
</div>
 <div id="google_translate_element"></div>
<nav>
<a href="index.html">Home</a>
<a href="safari-packages.html">Packages</a>
<a href="watamu-excursions.html">Excursions</a>
<a href="gallery.html">Gallery</a>
<a href="About_Shakur.html">About US</a>
<a href="contact.html">Contact</a>
</nav>
</header>
  
<h1>Safari Photo Gallery</h1>

<div class="gallery">

<img src="images/photo1.jpg" onclick="openImage(this.src)">
<img src="images/photo2.jpg" onclick="openImage(this.src)">
<img src="images/photo3.jpg" onclick="openImage(this.src)">
<img src="images/photo4.jpg" onclick="openImage(this.src)">
<img src="images/photo5.jpg" onclick="openImage(this.src)">
<img src="images/photo6.jpg" onclick="openImage(this.src)">
<img src="images/photo7.jpg" onclick="openImage(this.src)">
<img src="images/photo8.jpg" onclick="openImage(this.src)">
<img src="images/photo9.jpg" onclick="openImage(this.src)">
<img src="images/photo10.jpg" onclick="openImage(this.src)">
<img src="images/photo11.jpg" onclick="openImage(this.src)">
<img src="images/photo12.jpg" onclick="openImage(this.src)">
<img src="images/photo13.jpg" onclick="openImage(this.src)">
<img src="images/photo14.jpg" onclick="openImage(this.src)">
<img src="images/photo15.jpg" onclick="openImage(this.src)">
<img src="images/photo16.jpg" onclick="openImage(this.src)">

</div>


<!-- POPUP -->

<div id="popup">
<span onclick="closeImage()">&times;</span>
<img id="popup-img">
</div>


<script>

function openImage(src){
document.getElementById("popup").style.display="flex";
document.getElementById("popup-img").src=src;
}

function closeImage(){
document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
